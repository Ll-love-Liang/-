{% extends 'base.html' %}

{% block title %}{% if form.instance.id %}编辑{% else %}发布{% endif %}商品 - 校园二手商城{% endblock %}

{% block content %}
<h3 class="mb-4">{% if form.instance.id %}编辑{% else %}发布{% endif %}商品</h3>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary mt-3">提交</button>
    <a href="{% url 'goods_list' %}" class="btn btn-secondary mt-3">返回列表</a>
</form>
{% endblock %}
